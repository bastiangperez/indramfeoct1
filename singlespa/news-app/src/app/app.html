
<h1>News</h1>

@if (loading) {
  <p>Cargando noticias...</p>
}

@if (error) {
  <p>{{ error }}</p>
}

<div class="news-list">
  @for (item of news; track item.url) {
    <article class="news-card">

      @if (item.image_url) {
        <img
          [src]="item.image_url"
          [alt]="item.title"
        />
      }

      <div class="news-content">
        <h3>{{ item.title }}</h3>
        <p>{{ item.summary }}</p>

        <div class="actions">
          <a
            [href]="item.url"
            target="_blank"
            rel="noopener noreferrer">
            Leer más
          </a>

          <button (click)="addFavorite(item)">
            ⭐ Añadir a favoritos
          </button>
        </div>
      </div>

    </article>
  }
</div>

<router-outlet />
