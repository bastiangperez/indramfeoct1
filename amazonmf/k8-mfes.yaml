apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
  namespace: mfe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shell
  template:
    metadata:
      labels:
        app: shell
    spec:
      containers:
      - name: shell
        image: imf/shell:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shell
  namespace: mfe
spec:
  selector:
    app: shell
  ports:
  - name: http
    port: 80
    targetPort: 80
